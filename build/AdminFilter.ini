; =====================================================================
;  AdminFilter.ini  -  GTA: Central | Text Based
;  HOT RELOAD: edit & save saat main -> langsung berlaku tanpa restart.
;  Saat start_monitor.bat TIDAK dibuka, otomatis Enabled=0 (semua chat
;  masuk ke in-game seperti biasa). Saat start_monitor.bat dibuka,
;  otomatis Enabled=1 dan hanya channel yang [ON] yang dipindah ke CMD.
; =====================================================================

[General]
Enabled=0
RequireMonitor=1
CaseSensitive=0
CaptureAll=1
LogDir=AdminFilter\logs
ReloadIntervalMs=250

; --- Hook SA-MP 0.3.DL-R1 ---
AddEntryOffset=0x67650
ExpectedEntryPoint=0xFDB60
ForceHook=0

[Monitor]
Highlight=Sanctuary|Lucian|@admin
TailLines=30
TileMonitor=2
TileColumns=2

; =====================================================================
;  CHANNEL  (Tekan angka 1-7 di Control Panel untuk ON/OFF kapan saja)
;  Enabled=1 & Window=1 -> Buka di CMD & sembunyikan dari in-game
;  Enabled=0 & Window=0 -> Tidak buka CMD & tetap muncul di in-game
; =====================================================================

[Channel:anticheat]
Title=ANTI-CHEAT
Enabled=1
Window=1
StartsWith=(AntiCheat)|[AC]|[ANTICHEAT]
Color=red
Beep=1200,150

[Channel:report]
Title=REPORTS
Enabled=1
Window=1
StartsWith=[REPORT]|Report from
Color=yellow
Beep=800,120

[Channel:ask]
Title=QUESTIONS / ASK
Enabled=1
Window=1
StartsWith=[ASK]|[QUESTION]|[HELPME]
Color=00C0FF
Beep=600,80

[Channel:admcmd]
Title=ADMIN CMD & WARN
Enabled=1
Window=1
StartsWith=AdmCmd:|AdmWarn:
Match=has been banned|has been kicked|has been jailed
Color=FF8000

[Channel:adminfo]
Title=ADMIN INFO
Enabled=1
Window=1
StartsWith=AdmInfo:
Color=FF6347

[Channel:adminchat]
Title=ADMIN & OOC CHAT
Enabled=1
Window=1
StartsWith=** (|(( Admin|[A]
Color=cyan

[Channel:spylogs]
Title=PM & RADIO LOGS
Enabled=0
Window=0
StartsWith=(Radio Logs)|(PM Logs)
Color=green
